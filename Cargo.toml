[package]
name = "greentree"
version = "0.4.2"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Test the tree, not every commit: verify a dirty working tree continuously, publish only verified trees."
repository = "https://github.com/reachpad/greentree"
keywords = ["git", "ci", "agents", "testing", "cache"]
categories = ["development-tools", "command-line-utilities"]

[features]
default = ["github"]
# GitHub commit-status posting. Off = no HTTP client, no TLS stack:
# `cargo install greentree --no-default-features` builds the pure-git tool.
github = ["dep:ureq"]

[dependencies]
blake3 = "1"
clap = { version = "4", features = ["derive"] }
glob = "0.3"
humantime = "2"
indexmap = { version = "2", features = ["serde"] }
nix = { version = "0.29", features = ["signal", "fs"] }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
serde_yaml = "0.9"
thiserror = "2"
tracing = "0.1"
ureq = { version = "2", features = ["json"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
debug = "line-tables-only"

[profile.release]
strip = true
lto = "thin"

[lints.rust]
unsafe_code = "deny"
