name: ci

# greentree's CI is `greentree serve` on a warm machine, which verifies
# every pushed commit and posts greentree/<check> statuses. This workflow
# is the cold-isolation fallback for pull requests (fork code should not
# run on the warm runner). It installs greentree from the checkout and
# runs the same `full` check the serve loop runs.

on:
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./action
        with:
          path: "."
          check: full
