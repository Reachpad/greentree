name: ci

# greentree's CI is greentree: the composite action installs the tool from
# this checkout and runs `greentree test`, whose `full` check is the whole
# gate (build + clippy + fmt + nextest + no-default-features + demo). The
# verdict cache in .git/greentree is restored across runs, so a re-run on
# content that already passed costs nothing.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./action
        with:
          path: "."
          check: full
