name: ci

# The cold-isolation fallback, for pull requests from FORKS only. Code from
# a fork is untrusted and cannot have been attested in a workspace, so it
# runs here in an ephemeral runner. Branches within this repo are verified
# before the push and carry a greentree/full status already, so this job
# skips them rather than re-running cold CI (which the pre-push gate exists
# to avoid). It installs greentree from the checkout and runs the same
# `full` check.

on:
  pull_request:

jobs:
  check:
    if: github.event.pull_request.head.repo.fork == true
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: taiki-e/install-action@v2
        with:
          tool: just,nextest
      - uses: Swatinem/rust-cache@v2
      - uses: ./action
        with:
          path: "."
          check: full
